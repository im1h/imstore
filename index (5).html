<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IM ستور | منتجات وخدمات رقمية</title>
<meta name="description" content="IM ستور: شحن ألعاب، اشتراكات منصات، أدوات ذكاء اصطناعي، VPN، بطاقات هدايا. اطلب عبر واتساب خلال دقائق.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#F2F4FA;--sf:#fff;--ink:#17163F;--mut:#5E6080;--ln:#E1E4F0;--ac:#E8365D;--ac2:#10A99B;--hero:#17163F;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0E26;--sf:#19183A;--ink:#EEF0FF;--mut:#9FA2C8;--ln:#2B2A57;--hero:#1F1D4D}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.7}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px}
.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px 10px 10px 2px;background:var(--ac);color:#fff;font-size:15px;letter-spacing:.5px}
nav.d{display:none;margin-inline-start:auto;gap:4px}
nav.d a{padding:6px 12px;border-radius:8px;color:var(--mut);font-size:15px}
nav.d a:hover{background:var(--bg);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--sf);cursor:pointer;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:18px;height:18px}
.hero{background:var(--hero);color:#fff;border-radius:0 0 28px 28px;padding:32px 0 36px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset-inline-start:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--ac);opacity:.9;filter:blur(2px)}
.hero::after{content:"";position:absolute;inset-inline-end:-40px;bottom:-70px;width:200px;height:200px;border-radius:40px;transform:rotate(20deg);background:var(--ac2);opacity:.85}
.hero .w{position:relative;z-index:1}
.hero h1{font-size:clamp(28px,6vw,48px);line-height:1.3;margin:0 0 10px;max-width:640px}
.hero p{margin:0 0 20px;opacity:.85;max-width:520px}
.sb{display:flex;align-items:center;gap:8px;background:var(--sf);color:var(--ink);border-radius:14px;padding:4px 14px;max-width:560px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sb input{flex:1;border:0;background:none;height:46px;outline:0;min-width:0}
.sb svg{color:var(--mut)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pills span{background:rgba(255,255,255,.14);border-radius:99px;padding:3px 12px;font-size:13px}
section.s{padding:28px 0 4px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sh h2{margin:0;font-size:21px}
.sh a{color:var(--ac);font-size:14px;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cat{display:flex;align-items:center;gap:10px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;font-weight:500;font-size:15px;transition:transform .2s,border-color .2s}
@media (max-width:699px){.cat:last-child:nth-child(odd){grid-column:1/-1}}.cat:hover{transform:translateY(-2px);border-color:var(--ac)}
.cat i{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;color:#fff;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.tile{position:relative;aspect-ratio:4/3;display:grid;place-items:center;color:#fff;overflow:hidden}
.tile em{font-style:normal;font-weight:700;font-size:clamp(26px,7vw,40px);letter-spacing:1px;direction:ltr;text-shadow:0 2px 12px rgba(0,0,0,.25);position:relative}
.tile svg.i{position:absolute;inset-inline-end:-14px;bottom:-14px;width:96px;height:96px;opacity:.18;stroke-width:1.2}
.tile::before{content:"";position:absolute;inset:-12px;background:var(--u) center/cover;filter:blur(16px) saturate(1.15)}.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.tag{z-index:1;position:absolute;top:8px;inset-inline-start:8px;background:#fff;color:var(--ac);font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb h3{margin:0;font-size:15px;line-height:1.4}
.cb p{margin:0;color:var(--mut);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{margin-top:auto;padding-top:6px;font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr s{color:var(--mut);font-weight:400;font-size:13px}
.pr small{color:var(--mut);font-weight:400;font-size:12px}
.bt{display:flex;gap:6px;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:9px 12px;cursor:pointer;font-weight:500;font-size:14px;min-height:40px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.96)}
.b1{background:var(--ac);color:#fff;flex:1}
.b2{background:var(--bg);border:1px solid var(--ln);color:var(--ink)}
.bwa{background:#1FA855;color:#fff;width:100%;min-height:50px;font-size:16px}
.ban{display:grid;gap:12px;margin-top:28px}
.bn{border-radius:20px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.bn h3{margin:0;font-size:20px}.bn p{margin:0;opacity:.9;font-size:14px;max-width:300px}
.bn svg.i{position:absolute;inset-inline-end:-10px;bottom:-16px;width:120px;height:120px;opacity:.2;stroke-width:1.2}
.fl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fl label{font-size:14px;color:var(--mut)}
.fl select{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.fl input[type=range]{accent-color:var(--ac);width:140px}
.crumb{padding:16px 0 8px;font-size:14px;color:var(--mut)}
.crumb a{color:var(--ac)}
.det{display:grid;gap:18px;padding-bottom:20px}
.det .tile{border-radius:22px;aspect-ratio:16/10}
.det h1{margin:0 0 6px;font-size:26px;line-height:1.3}
.packs{display:grid;gap:8px;margin:14px 0}
.pk{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf);cursor:pointer;gap:10px}
.pk.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(232,54,93,.15)}
.pk span{display:flex;align-items:center;gap:10px}
.pk i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);display:inline-block}
.pk.on i{border:5px solid var(--ac)}
.feat{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px;color:var(--mut);font-size:14px}
.feat li{display:flex;gap:8px;align-items:center}.feat svg{color:var(--ac2);width:18px;height:18px}
.empty{text-align:center;padding:48px 0;color:var(--mut)}
footer{margin-top:40px;background:var(--hero);color:#fff;padding:32px 0 24px}
footer .w{display:grid;gap:22px}
footer h4{margin:0 0 8px;font-size:16px}
footer a,footer p{display:block;margin:0 0 4px;opacity:.85;font-size:14px}
.so{display:flex;gap:10px}.so a{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12)}
.cp{color:rgba(255,255,255,.7);font-size:13px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}.dv{display:flex;align-items:center;gap:10px;margin-top:10px}.lg{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}.dv .lg{width:48px;height:48px}
.wf{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#1FA855;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:30}
.wf svg{width:28px;height:28px}
.rv{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}.adm .f,.adm .f2{display:grid;gap:4px;font-size:13px;color:var(--mut);margin:8px 0}.adm input:not([type=checkbox]),.adm select,.adm textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:40px}.ar{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-bottom:8px}.ah{display:flex;flex-direction:column;cursor:pointer}.ah small{color:var(--mut)}.pr2{display:flex;gap:6px;margin-bottom:6px}.ck{display:flex;gap:8px;align-items:center;margin:10px 0}.abar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px;margin:14px 0;z-index:5}.abar .b1{flex:none}
.pay{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}.pay h3{margin:0 0 6px;font-size:16px}.amt{margin:0 0 8px}.amt b{color:var(--ac);font-size:20px}.qr{display:block;width:220px;max-width:70%;margin:8px auto;border-radius:14px}.addr{display:flex;gap:8px;align-items:center;margin-top:8px}.addr code{flex:1;direction:ltr;text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px;font-size:13px;word-break:break-all;user-select:all}.hint{color:var(--mut);font-size:12.5px;margin:8px 0 0}.f3{display:grid;gap:4px;font-size:13px;color:var(--mut)}.f3 input{background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:42px;width:100%}.dis{opacity:.45;pointer-events:none}:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){.cats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}.ban{grid-template-columns:1fr 1fr}.det{grid-template-columns:1fr 1fr;align-items:start}nav.d{display:flex}footer .w{grid-template-columns:2fr 1fr 1fr}.chips{padding-inline:0}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
